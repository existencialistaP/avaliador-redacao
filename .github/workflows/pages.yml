name: Deploy front (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A API padrão vem da variável de repositório API_BASE (Settings > Variables).
      # Sem ela, o front sobe apontando para a própria origem e mostra o aviso de configurar.
      - name: Apontar o front para a API
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -n "$API_BASE" ]; then
            sed -i "s|window.API_BASE = \"\";|window.API_BASE = \"$API_BASE\";|" public/index.html
            echo "API_BASE -> $API_BASE"
          else
            echo "::warning::Variável API_BASE não definida; o front ficará sem backend até configurar."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
